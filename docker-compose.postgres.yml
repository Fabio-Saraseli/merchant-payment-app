services:
  backend:
    environment:
      DB_DSN: "pgsql:host=postgres;port=5432;dbname=merchant_payments"
      DB_USER: merchant_app
      DB_PASSWORD: merchant_password

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: merchant_payments
      POSTGRES_USER: merchant_app
      POSTGRES_PASSWORD: merchant_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: