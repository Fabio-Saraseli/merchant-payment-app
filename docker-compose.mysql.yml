services:
  backend:
    environment:
      DB_DSN: "mysql:host=mysql;port=3306;dbname=merchant_payments;charset=utf8mb4"
      DB_USER: merchant_app
      DB_PASSWORD: merchant_password

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: merchant_payments
      MYSQL_USER: merchant_app
      MYSQL_PASSWORD: merchant_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: